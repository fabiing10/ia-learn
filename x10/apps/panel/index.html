<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B0F1A%22/%3E%3Cpath d=%22M28 28L72 72M72 28L28 72%22 stroke=%22%23E8B53A%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <title>x10 · Panel en vivo</title>
    <script>
      // Theme and big-type mode before first paint.
      (function () {
        var d = document.documentElement, t = null;
        try {
          t = localStorage.getItem('x10-theme');
          if (localStorage.getItem('x10-panel-big') === '1') d.classList.add('is-big');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <header class="bar">
      <div class="bar__brand">
        <a class="mark" href="/" aria-label="x10, ir a la presentación"><span class="mark__x">×</span>10</a>
        <span class="bar__title">Panel en vivo</span>
      </div>
      <form class="sess" id="sess-form" hidden>
        <label for="sess-input">Sesión</label>
        <input id="sess-input" name="s" list="sess-list" autocomplete="off" spellcheck="false" maxlength="40" />
        <datalist id="sess-list"></datalist>
        <button class="btn btn--ghost btn--sm" type="submit">Ver</button>
      </form>
      <p class="status" id="status" data-state="idle" role="status"><i aria-hidden="true"></i><span></span></p>
      <div class="bar__tools" id="tools" hidden>
        <button class="btn btn--ghost btn--sm" id="big" type="button" aria-pressed="false">Letra grande</button>
        <button class="btn btn--ghost btn--sm" id="csv" type="button">CSV</button>
        <button class="btn btn--ghost btn--sm btn--warn" id="clear" type="button">Borrar sesión</button>
        <button class="icon-btn" id="logout" type="button" aria-label="Cerrar sesión" hidden></button>
      </div>
      <button class="icon-btn" id="theme" type="button"></button>
    </header>
    <section class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <div class="confirm__box">
        <h2 id="confirm-title">¿Borrar las respuestas de <span id="confirm-session"></span>?</h2>
        <p id="confirm-body"></p>
        <div class="confirm__actions">
          <button class="btn btn--ghost" id="confirm-no" type="button">Cancelar</button>
          <button class="btn btn--danger" id="confirm-yes" type="button">Sí, borrar</button>
        </div>
      </div>
    </section>
    <main id="view" class="view"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
