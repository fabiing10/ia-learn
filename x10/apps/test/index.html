<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="description" content="Test x10: descubre tu nivel con la inteligencia artificial en 3 minutos." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B0F1A%22/%3E%3Cpath d=%22M28 28L72 72M72 28L28 72%22 stroke=%22%23E8B53A%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <title>x10 · ¿Qué tan multiplicador eres con la IA?</title>
    <script>
      // Theme before first paint: saved choice, else the OS preference, else dark.
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('x10-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <span class="mark topbar__mark" aria-label="x10"><span class="mark__x" aria-hidden="true">×</span>10</span>
        <div class="topbar__end">
          <span class="badge badge--demo" id="demo-badge" hidden>Modo demo</span>
          <button class="icon-btn" id="theme" type="button"></button>
        </div>
      </header>
      <main id="screen" class="screen"></main>
    </div>
    <p class="sr-only" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px">Este test necesita JavaScript activado.</p></noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
