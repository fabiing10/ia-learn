<!doctype html>
<html lang="es-CO" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0F1A" />
    <title>Talleres · Fabian Zapata</title>
    <meta name="description" content="Talleres prácticos de inteligencia artificial con Fabian Zapata: presentación, playbook y materiales de cada uno." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B0F1A%22/%3E%3Cpath d=%22M30 30h40M30 50h40M30 70h24%22 stroke=%22%23F2F2F2%22 stroke-width=%2210%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <script>
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('x10-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.dataset.theme = t;
      })();
    </script>
    <script type="module" src="./talleres.js"></script>
  </head>
  <body>
    <a class="sr-only" href="#lista">Saltar a la lista de talleres</a>
    <header class="hub-bar">
      <p class="hub-bar__name">Talleres</p>
      <button class="hub-theme btn btn--quiet" type="button" data-theme-toggle></button>
    </header>
    <main class="hub">
      <section class="hub-hero">
        <p class="eyebrow">Fabian Zapata</p>
        <h1>Talleres de IA, cada uno con su presentación y su playbook.</h1>
        <p class="hub-hero__lead">Elige el taller en el que estás. Cada uno tiene su landing, la presentación que se proyecta en clase y un playbook para seguir solo.</p>
      </section>
      <ul class="hub-list" id="lista" aria-label="Talleres disponibles"></ul>
    </main>
  </body>
</html>
