<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B0F1A%22/%3E%3Cpath d=%22M28 28L72 72M72 28L28 72%22 stroke=%22%23E8B53A%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3C/svg%3E" />
    <title>x10 · Multiplica tus talentos con inteligencia artificial</title>
    <script>
      // Restore theme and lite mode before first paint (no flash on reload).
      (function () {
        var d = document.documentElement;
        var q = location.search;
        try {
          var t = localStorage.getItem('x10-theme');
          if (t === 'light' || t === 'dark') d.dataset.theme = t;
          if (localStorage.getItem('x10-lite') === '1') d.classList.add('is-lite');
        } catch (e) {}
        if (/receiver/i.test(q)) d.classList.add('is-receiver', 'is-lite');
        if (/print-pdf/i.test(q)) d.classList.add('is-print', 'is-lite');
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('is-reduced', 'is-lite');
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg-static" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <div class="reveal">
      <div class="slides">
        <!-- @slides -->
      </div>
    </div>

    <div class="curtain" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="curtain__edge" d="M0 100 L100 100 L100 100 Q50 100 0 100 Z" />
        <path class="curtain__body" d="M0 100 L100 100 L100 100 Q50 100 0 100 Z" />
      </svg>
      <svg class="curtain__x" viewBox="0 0 100 100">
        <path d="M22 22 L78 78" />
        <path d="M78 22 L22 78" />
      </svg>
      <div class="curtain__label"></div>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
